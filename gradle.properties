# AndroidX is required by androidx.mediarouter and other AndroidX dependencies.
android.useAndroidX=true

# The Telegram client and Media3 modules require a larger heap during compilation.
org.gradle.jvmargs=-Xms512m -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Keep memory usage predictable on hosted CI runners.
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.vfs.watch=false
